<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="games-page">
    <h1 class="games-heading">Choose a game</h1>
    <main class="game-list">
        <a class="game-card" href="blackjack.html">
            <figure>
                <img class="game-image" src="black-jack-poker.svg" alt="Blackjack">
                <figcaption>Play Blackjack!</figcaption>
            </figure>
        </a>

        <a class="game-card" href="mvp.html">
            <figure>
                <img class="game-image" src="slot.svg" alt="Slots">
                <figcaption>Play Slots!</figcaption>
            </figure>
        </a>

        <a class="game-card" href="roulette.html">
            <figure>
                <div class="roulette-card-wheel" role="img" aria-label="European roulette wheel preview"><span>0</span></div>
                <figcaption>Play Roulette!</figcaption>
            </figure>
        </a>

        <a class="game-card" href="prize-wheel.html">
            <figure>
                <div class="prize-card-wheel" role="img" aria-label="Prize wheel preview"><span>GO</span></div>
                <figcaption>Play Prize Wheel!</figcaption>
            </figure>
        </a>
    </main>
</body>
</html>
