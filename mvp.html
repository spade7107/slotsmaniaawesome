<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Slot Machine</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        .stats {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 1.6rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid #555;
        }
        .casino-container {
            background: #222233;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            text-align: center;
            border: 4px solid #ffcc00;
        }
        .casino-container h1 {
            font-size: 2.5rem;
            margin-top: 0;
        }
        /* 3x3 Grid Layout */
        .slots-window {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #111;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: inset 6px #444;
        }
        .reel {
            font-size: 4rem;
            width: 100px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #000;
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        }
        button {
            background-color: #ffcc00;
            color: #111;
            border: none;
            padding: 16px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #ffd633;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        #message {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            height: 35px;
        }
    </style>
</head>
<body>

    <div class="stats">
        Balance: $<span id="balance">100</span>
    </div>

    <div class="casino-container">
        <h1>3x3 Slot Machine</h1>
        
        <div class="slots-window">
            <!-- Row 1 -->
            <div id="r0c0" class="reel">🍒</div>
            <div id="r0c1" class="reel">🍋</div>
            <div id="r0c2" class="reel">🔔</div>
            <!-- Row 2 -->
            <div id="r1c0" class="reel">⭐</div>
            <div id="r1c1" class="reel">7️⃣</div>
            <div id="r1c2" class="reel">🍒</div>
            <!-- Row 3 -->
            <div id="r2c0" class="reel">🍋</div>
            <div id="r2c1" class="reel">🔔</div>
            <div id="r2c2" class="reel">⭐</div>
        </div>

        <button id="spinBtn" onclick="spin()">SPIN ($10)</button>
        <div id="message"></div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🔔', '⭐', '7️⃣'];
        let balance = 100;

        function spin() {
            const balanceEl = document.getElementById('balance');
            const messageEl = document.getElementById('message');
            const spinBtn = document.getElementById('spinBtn');

            if (balance < 10) {
                messageEl.style.color = '#ff4d4d';
                messageEl.textContent = 'Game Over! Out of cash.';
                return;
            }

            balance -= 10;
            balanceEl.textContent = balance;
            messageEl.textContent = 'Spinning... 🎰';
            messageEl.style.color = '#fff';
            spinBtn.disabled = true;

            // Generate a 3x3 matrix for the final result
            let finalGrid = [
                [randSym(), randSym(), randSym()],
                [randSym(), randSym(), randSym()],
                [randSym(), randSym(), randSym()]
            ];

            let counter = 0;
            const interval = setInterval(() => {
                // Flash random symbols across all 9 slots
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        document.getElementById(`r${r}c${c}`).textContent = randSym();
                    }
                }
                counter++;

                // Stop after ~1.8 seconds (30 ticks * 60ms)
                if (counter > 30) {
                    clearInterval(interval);
                    
                    // Display final grid results
                    for (let r = 0; r < 3; r++) {
                        for (let c = 0; c < 3; c++) {
                            document.getElementById(`r${r}c${c}`).textContent = finalGrid[r][c];
                        }
                    }

                    evaluateWins(finalGrid);
                    spinBtn.disabled = false;
                }
            }, 60);
        }

        function randSym() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function evaluateWins(grid) {
            const balanceEl = document.getElementById('balance');
            const messageEl = document.getElementById('message');
            let totalWinnings = 0;
            let winningLinesCount = 0;

            // Helper function for rows and columns (pays more for 7s)
            function checkLine(a, b, c, reward7s, rewardNormal) {
                if (a === b && b === c) {
                    winningLinesCount++;
                    if (a === '7️⃣') {
                        totalWinnings += reward7s;
                    } else {
                        totalWinnings += rewardNormal;
                    }
                }
            }

            // 1. Check Rows (3 horizontal lines)
            for (let r = 0; r < 3; r++) {
                checkLine(grid[r][0], grid[r][1], grid[r][2], 100, 30);
            }

            // 2. Check Columns (3 vertical lines) -> NEW!
            for (let c = 0; c < 3; c++) {
                checkLine(grid[0][c], grid[1][c], grid[2][c], 100, 30);
            }

            // 3. Check Diagonals (2 diagonal lines) -> NEW! (Flat $15)
            function checkDiagonal(a, b, c) {
                if (a === b && b === c) {
                    winningLinesCount++;
                    totalWinnings += 15;
                }
            }
            checkDiagonal(grid[0][0], grid[1][1], grid[2][2]); // Top-Left to Bottom-Right
            checkDiagonal(grid[0][2], grid[1][1], grid[2][0]); // Top-Right to Bottom-Left

            // Final message output
            if (winningLinesCount > 0) {
                messageEl.textContent = `WIN! ${winningLinesCount} winning line(s)! (+$${totalWinnings})`;
                messageEl.style.color = '#4cd137';
            } else {
                messageEl.textContent = 'Try again!';
                messageEl.style.color = '#ff4d4d';
            }

            balance += totalWinnings;
            balanceEl.textContent = balance;
        }
    </script>

</body>
</html>
